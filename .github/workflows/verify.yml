name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

# One run per pull request or commit; a newer push to a pull request cancels the run it replaces,
# while every commit on main is verified to the end.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This repository is public, so pull requests from forks run here: only on GitHub-hosted runners,
# with a read-only token and no secrets. Never move these jobs to a self-hosted runner. Every action is
# pinned to a full commit SHA, which Dependabot keeps current.
jobs:
  check:
    name: Format, vet, race tests and 100% coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - run: make check
      - name: Dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Race tests and the same coverage floor on the other systems, whose own files, such as the credentials
  # lock for Windows, only they compile.
  test:
    name: Tests and 100% coverage on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - run: sh scripts/coverage.sh
        shell: bash

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=.exe; fi
          make "dist/snaphop-maps-$GOOS-$GOARCH$suffix"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snaphop-maps-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/snaphop-maps-*
          retention-days: 7

  security:
    name: Security checks
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Security policy regression tests
        run: python3 -m unittest discover -s security -p 'test_*.py' -v
      - name: Dependency, secret, configuration and container policy
        run: python3 security/check.py
      - name: Upload security reports and SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-reports/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Remove job-scoped security images
        if: always()
        run: python3 security/check.py --cleanup
