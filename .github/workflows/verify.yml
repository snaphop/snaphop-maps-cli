name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

# One run per pull request or commit; a newer push to a pull request cancels the run it replaces,
# while every commit on main is verified to the end.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This repository is public, so pull requests from forks run here: only on GitHub-hosted runners,
# with a read-only token and no secrets. Never move these jobs to a self-hosted runner. Every action is
# pinned to a full commit SHA, which Dependabot keeps current.
jobs:
  check:
    name: Format, vet, race tests and 100% coverage
    runs-on: ubuntu-26.04
    # The checks' 15 minutes plus the 10 the separate platform builds had.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The platform builds stamp the version git describe gives.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - run: make check
      - name: Dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # Cross-compiles every release platform, which were six jobs of their own: Go builds each from
      # this one machine, so one job holds one hosted runner instead of six (ADR 0011). Each binary is
      # its own make target, as before, and a failed one fails the step.
      - name: Build every platform
        if: ${{ !cancelled() }}
        run: |
          make -j "$(nproc)" \
            dist/snaphop-maps-linux-amd64 dist/snaphop-maps-linux-arm64 \
            dist/snaphop-maps-darwin-amd64 dist/snaphop-maps-darwin-arm64 \
            dist/snaphop-maps-windows-amd64.exe dist/snaphop-maps-windows-arm64.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        # A refused upload, such as one over the artifact storage quota, must not fail the checks.
        continue-on-error: true
        with:
          name: snaphop-maps-binaries
          path: dist/snaphop-maps-*
          retention-days: 7

  # Race tests and the same coverage floor on the other systems, whose own files, such as the credentials
  # lock for Windows, only they compile.
  test:
    name: Tests and 100% coverage on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - run: sh scripts/coverage.sh
        shell: bash

  security:
    name: Security checks
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Security policy regression tests
        run: python3 -m unittest discover -s security -p 'test_*.py' -v
      - name: Dependency, secret, configuration and container policy
        run: python3 security/check.py
      - name: Upload security reports and SBOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # A refused upload, such as one over the artifact storage quota, must not fail the checks.
        continue-on-error: true
        with:
          name: security-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-reports/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Remove job-scoped security images
        if: always()
        run: python3 security/check.py --cleanup
