name: Release
# Click "Run workflow" on main to release what CHANGELOG.md lists under Unreleased (ADR 0006). The run checks
# main with that list recorded as the next version's section, commits the section to main and pushes the tag
# vMAJOR.MINOR.PATCH in one atomic push, then starts this workflow again on the tag. A tag pushed by hand starts
# it too (ADR 0002).
#
# On a tag, the release is published only when the tag and a CHANGELOG section agree and every check passes:
# each platform is built in its own job, concurrently, from the tagged commit, the Agent Skill is packed beside
# them, and every file gets a signed build provenance attestation.
#
# Tick "dry run" to see the version and notes a click would release, from any branch: it runs every check and
# commits, tags and publishes nothing.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: >-
          auto (minor when Unreleased adds, changes, removes or deprecates anything, otherwise patch),
          patch, minor, major, or MAJOR.MINOR.PATCH
        required: true
        default: auto
        type: string
      dry-run:
        description: Show what would be released; commit, tag and publish nothing.
        required: false
        default: false
        type: boolean
permissions:
  contents: read
# One run per tag, or per branch a release is cut from, at a time. A fixed group would keep only the newest of
# several waiting runs and cancel the rest, so a tag pushed meanwhile could go unreleased.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
env:
  TAG: ${{ github.ref_name }}

# This repository is public: GitHub-hosted runners only, and write permissions only in the job that commits
# the changelog section and pushes its tag, which runs only on main, and the one that publishes, which runs
# only on a tag. Neither runs the module's code.
jobs:
  cut:
    name: Record the next version and run every check
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.cut.outputs.version }}
      date: ${{ steps.cut.outputs.date }}
    steps:
      - name: A release is cut from main
        if: ${{ !inputs.dry-run }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "A release is cut from main, not $GITHUB_REF. Tick dry run to try another branch." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - name: Record Unreleased as the next version
        id: cut
        env:
          WANT: ${{ inputs.version }}
        run: |
          date=$(date -u +%F)
          version=$(scripts/release-cut.sh "$WANT" "$date")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already tagged" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          {
            echo "# v$version"
            echo
            scripts/release-notes.sh "v$version"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Format, vet, race tests and 100% coverage
        run: make check
      - name: Dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  tag:
    name: Commit the changelog, push the tag and release it
    needs: cut
    if: ${{ github.ref == 'refs/heads/main' && !inputs.dry-run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Commit the changelog section and push it with its tag
        env:
          VERSION: ${{ needs.cut.outputs.version }}
          DATE: ${{ needs.cut.outputs.date }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test "$(scripts/release-cut.sh "$VERSION" "$DATE")" = "$VERSION"
          export GIT_AUTHOR_NAME="$ACTOR" GIT_AUTHOR_EMAIL="$ACTOR_ID+$ACTOR@users.noreply.github.com"
          export GIT_COMMITTER_NAME='github-actions[bot]'
          export GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "Release $VERSION" -m "Records Unreleased as $VERSION — $DATE. Cut by $RUN" -- CHANGELOG.md
          message="snaphop-maps $VERSION"
          notes=$(scripts/release-notes.sh "v$VERSION")
          if grep -q '^\*\*Security release' <<<"$notes"; then
            message="$message: security release"
          fi
          git tag -a "v$VERSION" -m "$message"
          # Atomic: neither lands unless both do, and only while main is still the commit that was checked.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION"
      - name: Release the tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.cut.outputs.version }}
        run: |
          # A tag pushed with this run's token starts no workflow, but a dispatch does.
          gh workflow run release.yml --ref "v$VERSION"
          echo "v$VERSION is tagged and its release has started: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/release.yml" >> "$GITHUB_STEP_SUMMARY"

  check:
    name: Tag, changelog and every check
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - name: The tag and the changelog agree, and the commit is on main
        run: |
          scripts/release-check.sh "$TAG"
          scripts/release-notes.sh "$TAG" > /dev/null
      - name: Format, vet, race tests and 100% coverage
        run: make check
      - name: Dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: check
    strategy:
      fail-fast: true
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: false}
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=.exe; fi
          make "dist/snaphop-maps-$GOOS-$GOARCH$suffix" VERSION="$TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snaphop-maps-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/snaphop-maps-*
          if-no-files-found: error
          retention-days: 7

  skill:
    name: Pack the Agent Skill
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: false}
      - run: make dist/snaphop-maps-skill.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snaphop-maps-skill
          path: dist/snaphop-maps-skill.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and publish
    needs: [build, skill]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: snaphop-maps-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          test "$(ls dist | wc -l)" -eq 7
          cd dist && sha256sum snaphop-maps-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/snaphop-maps-*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh release create publishes the tag where it points now: refuse one moved since this run built.
          target=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if [ "$target" != "$GITHUB_SHA" ]; then
            echo "$TAG now points at $target, not $GITHUB_SHA, which was built and attested" >&2
            exit 1
          fi
          scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "SnapHop Maps CLI ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" \
            dist/snaphop-maps-* dist/SHA256SUMS
